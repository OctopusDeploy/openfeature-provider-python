name: CI build

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  schedule:
    # Daily 5am Australia/Brisbane time
    - cron: "0 19 * * *"

  workflow_dispatch:

permissions:
  contents: read

env:
  OCTOPUS_SPACE: "Developer Experience"

jobs:
  test-python:
    name: test (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Every CPython version still maintained, from the requires-python floor
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ matrix.python-version }}

      - name: Check uv.lock is up to date
        run: uv lock --check

      - name: Install
        run: uv sync --locked

      - name: Test
        run: uv run pytest

  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          # The requires-python floor, which mypy checks against
          python-version: "3.11"

      - name: Install
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check --output-format=github

      - name: Check formatting
        run: uv run ruff format --check

      - name: Type-check
        run: uv run mypy

  # Scans every package in uv.lock, including transitive and dev dependencies.
  # The nightly run catches advisories published against an unchanged lockfile.
  audit:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Export the locked dependencies
        run: uv export --frozen --format requirements.txt --no-emit-project --no-group audit --output-file "$RUNNER_TEMP/requirements.txt"

      - name: Audit for known vulnerabilities
        run: uv run --frozen --only-group audit pip-audit --requirement "$RUNNER_TEMP/requirements.txt" --require-hashes --disable-pip --strict

  test-build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # Required to obtain the ID token from GitHub Actions
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build, Test, Pack, and Deploy (CI)
        uses: ./.github/actions/build-test-pack-deploy
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          prerelease-tag: "ci"
          octopus-url: ${{ secrets.OCTOPUS_URL }}

      - name: Prepare PR version suffix
        if: github.event_name == 'pull_request'
        id: pr-version
        env:
          BRANCH_NAME: ${{ github.head_ref }}
        run: |
          # Sanitize: replace special chars with hyphens, convert to lowercase
          SANITIZED=$(echo "$BRANCH_NAME" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9-]/-/g' | sed 's/^-*//' | sed 's/-*$//')
          # Truncate to 20 characters
          TRUNCATED=${SANITIZED:0:20}
          # Remove trailing hyphens after truncation
          TRUNCATED=$(echo "$TRUNCATED" | sed 's/-*$//')
          echo "branch-name=$TRUNCATED" >> "$GITHUB_OUTPUT"

      - name: Build, Test, Pack, and Deploy (PR)
        uses: ./.github/actions/build-test-pack-deploy
        if: github.event_name == 'pull_request'
        with:
          prerelease-tag: pr.${{ github.event.pull_request.number }}.${{ steps.pr-version.outputs.branch-name }}
          octopus-url: ${{ secrets.OCTOPUS_URL }}

  # A single check to require on main, so its name doesn't change when the
  # tested Python versions do
  test:
    if: always()
    needs: test-python
    runs-on: ubuntu-latest

    steps:
      - name: Check every Python version passed
        run: test "${{ needs.test-python.result }}" = "success"
