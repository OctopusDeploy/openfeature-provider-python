[project]
name = "octopus-openfeature-provider"
version = "0.0.0"
description = "The Octopus Deploy Python OpenFeature provider"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Octopus Deploy" }]
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27,<1",
    "openfeature-sdk>=0.10.0,<0.11",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Typing :: Typed",
]

[project.urls]
Repository = "https://github.com/OctopusDeploy/openfeature-provider-python"

[dependency-groups]
dev = [
    "griffelib>=2.4.1",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]
# Kept out of dev so a plain uv sync doesn't install it, and its own
# dependencies aren't part of the audited graph
audit = [
    "pip-audit>=2.10.1",
]

[build-system]
requires = ["uv_build>=0.13.4,<0.14"]
build-backend = "uv_build"

[tool.uv]
exclude-newer = "2 days"

[tool.uv.build-backend]
# The specification fixtures submodule is only read by the tests
source-exclude = ["/specification"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# Rule set based on the OpenFeature Python SDK's
[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = [
    "A",
    "B",
    "C4",
    "C90",
    "E",
    "F",
    "FLY",
    "FURB",
    "I",
    "LOG",
    "N",
    "PERF",
    "PGH",
    "PLC",
    "PLR0913",
    "PLR0915",
    "RUF",
    "S",
    "SIM",
    "T10",
    "T20",
    "UP",
    "W",
    "YTT",
]
ignore = [
    "E501", # The formatter handles line length
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*" = ["PLR0913", "S101"]

[tool.ruff.lint.pylint]
max-args = 6
max-statements = 30

[tool.mypy]
files = ["src", "tests"]
python_version = "3.11" # Matches the requires-python floor
strict = true
pretty = true
